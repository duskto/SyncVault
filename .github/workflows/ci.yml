name: SyncVault checks
on: [push, pull_request]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.11
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q -o faulthandler_timeout=30

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: syncvault
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: syncvault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syncvault -d syncvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYNCVAULT_TEST_DATABASE_URL: postgresql+psycopg://syncvault:test-only-password@127.0.0.1:5432/syncvault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q -o faulthandler_timeout=30
